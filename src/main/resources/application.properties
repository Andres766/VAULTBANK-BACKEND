spring.application.name=vaultbank

# ==========================================================================
# Perfil activo: por defecto "local" (carga application-local.properties con
# las credenciales reales, que NO se versiona).
# En produccion (Render) se pasan las variables de entorno y, opcionalmente,
# se puede fijar SPRING_PROFILES_ACTIVE=prod.
# ==========================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===== PostgreSQL =====
# Los valores reales llegan por variables de entorno (Render) o por
# application-local.properties (desarrollo local). Los fallbacks son inocuos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vaultbank}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# En produccion SE DEBE pasar JWT_SECRET por variable de entorno.
jwt.secret=${JWT_SECRET:dev-secret-solo-para-desarrollo-local-min32chars!!}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration-ms=86400000

# ===== Parametros del banco =====
banco.nombre=${BANCO_NOMBRE:VaultBank}
banco.gmf-tasa=${GMF_TASA:0.004}

# ===== Servidor =====
server.port=${PORT:8080}
